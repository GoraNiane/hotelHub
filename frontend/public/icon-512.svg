<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="palaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073F34"/>
      <stop offset="100%" stop-color="#022C25"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D4A8"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#9C7738"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with slight rounded corners for maskable icons -->
  <rect width="512" height="512" rx="100" fill="url(#palaceBg)"/>
  
  <!-- Subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Golden Emblem Outer Circle -->
  <circle cx="256" cy="226" r="140" fill="url(#goldGradient)" filter="url(#goldGlow)"/>
  <circle cx="256" cy="226" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Hotel Icon Silhouette in Deep Green #022C25 -->
  <g fill="#022C25" transform="translate(160, 130) scale(4)">
    <!-- Roof / Gable -->
    <path d="M10 22v-6.57a2 2 0 0 1 1.07-1.78l10.93-5.65a2 2 0 0 1 1.86 0l10.93 5.65A2 2 0 0 1 36 15.43V22" stroke="#022C25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Central Building Structure -->
    <path d="M6 40V23a2 2 0 0 1 2-2h32a2 2 0 0 1 2 2v17" stroke="#022C25" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Entrance Door -->
    <path d="M20 40V30a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v10" fill="#022C25"/>
    <!-- Windows -->
    <rect x="12" y="26" width="4" height="5" rx="1" fill="#022C25"/>
    <rect x="32" y="26" width="4" height="5" rx="1" fill="#022C25"/>
  </g>

  <!-- 5 Gold Luxury Stars -->
  <g fill="url(#goldGradient)" transform="translate(176, 385)">
    <!-- Star 1 -->
    <polygon points="10,1 13,7 19,8 15,13 16,19 10,16 4,19 5,13 1,8 7,7" transform="translate(0, 0) scale(1.4)"/>
    <!-- Star 2 -->
    <polygon points="10,1 13,7 19,8 15,13 16,19 10,16 4,19 5,13 1,8 7,7" transform="translate(32, 0) scale(1.4)"/>
    <!-- Star 3 (Center - slightly raised) -->
    <polygon points="10,1 13,7 19,8 15,13 16,19 10,16 4,19 5,13 1,8 7,7" transform="translate(64, -3) scale(1.6)"/>
    <!-- Star 4 -->
    <polygon points="10,1 13,7 19,8 15,13 16,19 10,16 4,19 5,13 1,8 7,7" transform="translate(98, 0) scale(1.4)"/>
    <!-- Star 5 -->
    <polygon points="10,1 13,7 19,8 15,13 16,19 10,16 4,19 5,13 1,8 7,7" transform="translate(130, 0) scale(1.4)"/>
  </g>

  <!-- Typography: TERANGA PALACE -->
  <text x="256" y="445" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" letter-spacing="6" fill="#F7F4EC" text-anchor="middle">TERANGA PALACE</text>
  <!-- Subtitle: HOTEL · DAKAR -->
  <text x="256" y="475" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" letter-spacing="8" fill="#C9A86A" text-anchor="middle">HOTEL · DAKAR</text>
</svg>
